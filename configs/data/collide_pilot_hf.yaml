# Verified HF inventory on 2026-11-06. Only these two original files are downloaded.
source:
  kind: hf_files
  dataset: fastmachinelearning/collide-1m
  revision: e67bf675673b371ee2303b3db00c59ef42375162
  download_dir: data/raw/collide_pilot
  max_download_bytes: 3000000000  # Selected files total 2,833,794,697 bytes.
  processes:
    tt0123j_5f_ckm_LO_MLM_semiLeptonic:
      - tt0123j_5f_ckm_LO_MLM_semiLeptonic/tt0123j_5f_ckm_LO_MLM_semiLeptonic-NEVENT10000-RS30000005.parquet
    WJetsToLNu_13TeV-madgraphMLM-pythia8:
      - WJetsToLNu_13TeV-madgraphMLM-pythia8/WJetsToLNu_13TeV-madgraphMLM-pythia8-NEVENT10000-RS44000011.parquet
output_dir: data/processed/collide_pilot
selection:
  events_per_process: 5000
  seed: 42
  read_batch_size: 64
model_config: ../models/foundation_tiny.yaml
reader:
  # Assumptions when input metadata does not declare units; inspect raw ranges.
  units: {momentum: GeV, angle: rad}
# Memberships are collected during export; one process per independent file.
partitions:
  enabled: true
  check_integrity_SHA256: fast  # strict preserves full file/event verification (v1).
  validation_fraction: 0.2
  test_fraction: 0.2
  read_batch_size: 2048  # Provenance batches for --stage partitions on existing exports.
  num_workers: 4  # 1, 2, 4 or 8; allocate CPUs and memory for these processes.
