# One common protocol; change only --view and --output-dir between the two runs.
# The sample and shared partitions must already exist (preparation steps 1/2).
mode: small
model_config: ../models/foundation_tiny.yaml
partition_manifest: data/processed/collide_pilot/partitions.json
output_dir: outputs/perceiver/supervised_fullreco
seed: 42
sources:
  small:
    processes:
      tt0123j_5f_ckm_LO_MLM_semiLeptonic: data/processed/collide_pilot/tt0123j_5f_ckm_LO_MLM_semiLeptonic
      WJetsToLNu_13TeV-madgraphMLM-pythia8: data/processed/collide_pilot/WJetsToLNu_13TeV-madgraphMLM-pythia8
    max_events_per_class: null
data:
  view: FullReco
  validation_fraction: 0.2
  test_fraction: 0.2
  units: {momentum: GeV, angle: rad}
  read_batch_size: 128
  shuffle_buffer: 512
  audit_events_per_class: 32
training:
  epochs: 3
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  device: auto
  num_workers: 0
  cpu_threads: 4
  log_every_batches: 100
evaluation:
  signal_process: tt0123j_5f_ckm_LO_MLM_semiLeptonic
  background_acceptance: 0.01
  min_background_events: 10
  score_shard_rows: 10000
