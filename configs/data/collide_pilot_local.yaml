# Replace these with readable local/mounted EOS files, directories or globs.
source:
  kind: local
  processes:
    tt0123j_5f_ckm_LO_MLM_semiLeptonic:
      - /eos/project/f/foundational-model-dataset/samples/production_final/tt0123j_5f_ckm_LO_MLM_semiLeptonic
    WJetsToLNu_13TeV-madgraphMLM-pythia8:
      - /eos/project/f/foundational-model-dataset/samples/production_final/WJetsToLNu_13TeV-madgraphMLM-pythia8
output_dir: data/processed/collide_pilot
selection:
  events_per_process: 5000
  seed: 42
  read_batch_size: 64
model_config: ../models/foundation_tiny.yaml
reader:
  units: {momentum: GeV, angle: rad}
# Memberships are collected during export; one process per independent file.
partitions:
  enabled: true
  check_integrity_SHA256: fast  # strict preserves full file/event verification (v1).
  validation_fraction: 0.2
  test_fraction: 0.2
  read_batch_size: 2048  # Provenance batches for --stage partitions on existing exports.
  num_workers: 4  # 1, 2, 4 or 8; allocate CPUs and memory for these processes.
