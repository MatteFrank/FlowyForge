# Both preparation configs create these same process directories.
# Use --view L1T with a separate --output-dir for the other view.
mode: small
model_config: ../models/foundation_tiny.yaml
output_dir: outputs/perceiver/collide_up_fullreco
seed: 42
# Optional, relative to the working directory. Create once with --stage partitions.
# partition_manifest: data/processed/collide_pilot/partitions.json
sources:
  small:
    processes:
      tt0123j_5f_ckm_LO_MLM_semiLeptonic: data/processed/collide_terabit/tt0123j_5f_ckm_LO_MLM_semiLeptonic
      WJetsToLNu_13TeV-madgraphMLM-pythia8: data/processed/collide_terabit/WJetsToLNu_13TeV-madgraphMLM-pythia8
    max_events_per_class: null  # Use every exported row; no second subsampling.
data:
  view: FullReco
  read_batch_size: 2048
  units: {momentum: GeV, angle: rad}
training:
  epochs: 3
  batch_size: 16
  device: auto
  num_workers: 0
