# Preparation only: bounded raw nested export, never scalar summaries.
# Use a new empty dataset_dir to refresh a sample; existing exports are protected.
paths:
  dataset_backend: hf
  hf_dataset_name: fastmachinelearning/collide-1m
  hf_split: train
  hf_data_dirs:
    - WJetsToLNu_13TeV-madgraphMLM-pythia8
    - DYJetsToLL_13TeV-madgraphMLM-pythia8
  local_cache_dir: data/hf_cache/collide-1m/download_cache
  dataset_dir: data/hf_cache/collide-1m/perceiver_raw

data:
  max_rows_per_process: 20  # 3..100; this helper is for small feasibility samples.
  max_files: 1             # Output Parquet shards per process.
