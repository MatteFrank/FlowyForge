# Offline synthetic example generated by scripts/make_tiny_parquet_sample.py.
mode: small
model_config: ../models/foundation_tiny.yaml
output_dir: outputs/perceiver/local
seed: 42
sources:
  small:
    processes:
      background: data/samples/perceiver_tiny/background
      signal: data/samples/perceiver_tiny/signal
    max_events_per_class: 40
data:
  view: FullReco
  units: {momentum: GeV, angle: rad}
training:
  epochs: 3
  batch_size: 16
  device: auto
  num_workers: 0
